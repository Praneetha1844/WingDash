[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wingdash"
version = "1.0.0"
description = "A side-scrolling flap-and-dodge game built with pygame."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pygame>=2.5"]
authors = [{ name = "Praneetha Potharaju" }]

[project.scripts]
wingdash = "wingdash.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wingdash = ["resources/sprites/*.png", "resources/sounds/*.wav"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
